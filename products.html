<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Portfolio | Orion Pharma India</title>
  <meta name="description" content="Explore Orion Pharma India's comprehensive range of fertility, gynecology, oncology and critical care pharmaceutical products. Quality medicines at affordable prices.">
  <meta name="keywords" content="orion pharma products, fertility medicines, gynecology products, hCG, GnRH antagonists, anticoagulants">
  <meta property="og:title" content="Product Portfolio | Orion Pharma India">
  <meta property="og:description" content="Explore our comprehensive range of fertility, gynecology and specialty healthcare products.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orionpharmaindia.org/products">
  <link rel="canonical" href="https://orionpharmaindia.org/products">
  <meta property="og:site_name" content="Orion Pharma">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== NAVBAR (injected by components.js) ==================== -->
  <div id="navbar-placeholder"></div>

  <!-- ==================== HERO ==================== -->
  <section class="hero hero--page" id="products-hero">
    <div class="hero__bg-image" style="position: absolute; inset: 0; background-image: url('assets/images/syg.jpg'); background-size: cover; background-position: center; opacity: 0.15; z-index: 1;"></div>
    <div class="hero__bg-pattern" style="z-index: 2;"></div>
    <div class="hero__glow hero__glow--1" style="z-index: 2;"></div>
    <div class="container">
      <div class="hero__content" style="text-align:center;max-width:700px;margin:0 auto;">
        <h1 class="hero__title">Product <span class="hero__title-accent">Portfolio</span></h1>
        <p class="hero__subtitle" style="margin:0 auto;">Comprehensive range of fertility, gynecology and specialty healthcare products.</p>
      </div>
    </div>
  </section>

  <!-- ==================== PRODUCTS CATALOG ==================== -->
  <section class="section" id="products-catalog">
    <div class="container">
      <!-- Toolbar -->
      <div class="products-toolbar fade-up">
        <div class="search-box">
          <svg class="search-box__icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="product-search" class="search-box__input" placeholder="Search products..." aria-label="Search products">
        </div>
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs fade-up" style="margin-bottom: var(--space-xl);">
        <button class="category-tab active" data-category="all">All Products</button>
        <button class="category-tab" data-category="fertility">Fertility Products</button>
        <button class="category-tab" data-category="hormonal">Hormonal Products</button>
        <button class="category-tab" data-category="hcg">hCG Products</button>
        <button class="category-tab" data-category="gnrh">GnRH Antagonists</button>
        <button class="category-tab" data-category="anticoagulant">Anticoagulants</button>
        <button class="category-tab" data-category="other">Other Products</button>
      </div>

      <!-- Product Count -->
      <p class="products-count fade-up">Showing <strong>0</strong> products</p>

      <!-- Product Grid -->
      <div class="grid grid--3" id="products-grid">
        <!-- Dynamic cards populated by main.js -->
      </div>
      
      <!-- Pagination Controls -->
      <div class="pagination fade-up" id="products-pagination"></div>
    </div>
  </section>

  <!-- ==================== CTA ==================== -->
  <section class="section cta-section" id="cta">
    <div class="cta-section__bg"></div>
    <div class="container">
      <div class="cta-section__content fade-up">
        <h2 class="cta-section__title">Need More Information About Our Products?</h2>
        <a href="contact.html" class="btn btn--white btn--lg">Contact Orion Pharma</a>
      </div>
    </div>
  </section>

  <!-- ==================== FOOTER (injected by components.js) ==================== -->
  <div id="footer-placeholder"></div>

  <!-- WhatsApp FAB (injected by components.js) -->
  <div id="whatsapp-fab-placeholder"></div>

  <!-- Back to Top (injected by components.js) -->
  <div id="back-to-top-placeholder"></div>

  <!-- Shared Scripts -->
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
